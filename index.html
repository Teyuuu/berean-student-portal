<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Berean Bible Baptist College — Student, Academic & Alumni Portal</title>
    <meta
      name="title"
      content="Berean Bible Baptist College — Student, Academic & Alumni Portal"
    />
    <meta
      name="description"
      content="Official Student, Registrar, and Alumni Academic Portal for Berean Bible Baptist College. Access admissions, student records, enrollment, curriculum tracking, grades, and alumni directory. 1 Peter 2:9 KJB."
    />
    <meta
      name="keywords"
      content="Berean Bible Baptist College, Berean student portal, Bible college Philippines, theological college admissions, Bachelor of Theology, Christian ministry education, registrar portal, student grades, alumni directory, BBBC"
    />
    <meta name="author" content="Berean Bible Baptist College" />
    <meta name="publisher" content="Berean Bible Baptist College" />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://berean-student-portal.netlify.app/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://berean-student-portal.netlify.app/" />
    <meta property="og:site_name" content="Berean Bible Baptist College" />
    <meta
      property="og:title"
      content="Berean Bible Baptist College — Student, Academic & Alumni Portal"
    />

      property="og:description"
      content="Official Academic and Admissions Portal for Berean Bible Baptist College. Dedicated to training servant-leaders for Christ through biblical higher education."

    <meta property="og:image:alt" content="Berean Bible Baptist College Official Seal" />

      name="twitter:title"
      content="Berean Bible Baptist College — Student, Academic & Alumni Portal"
    />

      name="twitter:description"
      content="Official Student, Admissions, and Alumni Portal for Berean Bible Baptist College. 1 Peter 2:9 KJB."
    />

    <!-- Favicons & Mobile Web App Settings -->
    <link rel="icon" type="image/png" href="/college-logo.png" />
    <link rel="apple-touch-icon" href="/college-logo.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Berean Portal" />

    <!-- Schema.org JSON-LD Structured Data for College/University -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollegeOrUniversity",
      "name": "Berean Bible Baptist College",
      "alternateName": ["BBBC", "Berean College"],
      "url": "https://berean-student-portal.netlify.app/",
      "logo": "https://berean-student-portal.netlify.app/college-logo.png",
      "description": "Independent Baptist institution of theological education and ministry preparation dedicated to biblical higher education in the Philippines. 1 Peter 2:9 KJB.",
      "foundingDate": "1990",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PH"
      },
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "name": "Bachelor of Theology",
          "credentialCategory": "degree"
        }
      ]
    }

  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-blue-900 selection:text-white">
